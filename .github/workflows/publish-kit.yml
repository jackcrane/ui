name: Publish UI Kit

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump kit minor version
        run: npm version minor --workspace=@jackcrane/ui --no-git-tag-version

      - name: Build kit
        run: npm run build:kit

      - name: Publish kit
        run: npm publish --workspace=@jackcrane/ui --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui-kit/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git commit -m "chore(release): bump @jackcrane/ui minor [skip ci]"
          git push
